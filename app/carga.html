<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cargar la clave de la app</title>
<meta name="robots" content="noindex">
<style>
body{margin:0;background:#FBFAF7;color:#102327;font:16px/1.5 system-ui,sans-serif;display:grid;place-items:center;min-height:100vh}
.t{background:#fff;border:1px solid #E3E0D8;border-radius:14px;padding:28px;max-width:440px;width:calc(100% - 32px)}
h1{font-size:21px;margin:0 0 8px}
p{color:#5F6E70;margin:0 0 16px}
input{width:100%;box-sizing:border-box;border:1px solid #E3E0D8;border-radius:10px;padding:12px;font:15px monospace}
button{margin-top:12px;width:100%;border:0;border-radius:10px;padding:12px;font:600 15px system-ui;background:#0E7F39;color:#fff;cursor:pointer}
#r{margin-top:14px;font-weight:600}
</style>
</head>
<body>
<div class="t">
  <h1>Pegá la clave secreta de la app</h1>
  <p>Meta for Developers → systemás → Casos de uso → API de Instagram → "Clave secreta de la app de Instagram" → Mostrar → copiar.</p>
  <input id="c" type="password" autocomplete="off" placeholder="32 letras y números">
  <button id="b">Guardar</button>
  <div id="r"></div>
</div>
<script>
const codigo = new URLSearchParams(location.hash.slice(1)).get("c") || "";
document.getElementById("b").onclick = async () => {
  const secreto = document.getElementById("c").value.trim().toLowerCase();
  const r = document.getElementById("r");
  r.textContent = "Guardando…";
  try {
    const x = await fetch("https://nvtjjzqzzfxegdhfehmo.supabase.co/functions/v1/systemas-ig/carga", {
      method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ codigo, secreto }),
    });
    const d = await x.json();
    r.textContent = d.ok ? "✅ Listo, ya está guardada. Podés cerrar esta pestaña." :
      d.error === "formato" ? "❌ Eso no parece la clave: tienen que ser 32 letras y números." :
      d.error === "ya cargada" ? "✅ Ya estaba guardada de antes." : "❌ No se pudo (" + d.error + ").";
    document.getElementById("c").value = "";
  } catch (e) { r.textContent = "❌ No se pudo conectar."; }
};
</script>
</body>
</html>
